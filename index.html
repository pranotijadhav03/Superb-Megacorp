    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLKQlCGn4yClPSNhjc_KMuH7IwOlNEayc",
            projectId: "dist-7b242",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.db = db;
        window.auth = auth;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.doc = doc;
        window.setDoc = setDoc;
        window.serverTimestamp = serverTimestamp;

        async function initApp() {
            try {
                const snap = await getDocs(collection(db, 'products'));
                const products = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    products.push({
                        id: doc.id,
                        name: data.name || '',
                        category: data.category || '',
                        mrp: parseInt((data.price || "0").toString().replace(/\D/g, '') || data.mrp || 0),
                        packing: data.description || data.packing || '',
                        image: data.imageUrl || data.image || '',
                        sku: data.sku || '',
                        status: data.status || 'active'
                    });
                });
                window.LIVE_PRODUCTS = products;
            } catch(e) {
                console.error("Failed to load live products", e);
            }
            
            const script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = '/assets/index-v3-1790311433406.js?v=' + Date.now();
            document.head.appendChild(script);
        }
        initApp();
    </script>

    <!-- Redirect to Home on Refresh -->
    <script>
      (function() {
          const currentPath = window.location.pathname;
          // Don't redirect if we are already on home, or if we are in admin panel
          if (currentPath !== '/' && !currentPath.startsWith('/admin')) {
              // Redirect to home page
              history.replaceState(null, '', '/');
          }
      })();
    </script>

    <!-- Scroll to Top on Load/Refresh Only -->
    


    <!-- Robust Scroll to Top -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      
      function forceScroll() {
          window.scrollTo(0, 0);
      }
      
      // Run immediately
      forceScroll();
      
      // Run after React mounts
      const observer = new MutationObserver((mutations) => {
          if (document.body.scrollHeight > 1000) {
              forceScroll();
              setTimeout(forceScroll, 100);
              observer.disconnect();
          }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      
      // Hook into SPA navigation
      const originalPushState = history.pushState;
      history.pushState = function() {
          originalPushState.apply(this, arguments);
          forceScroll();
          setTimeout(forceScroll, 50);
          setTimeout(forceScroll, 150);
      };
      
      const originalReplaceState = history.replaceState;
      history.replaceState = function() {
          originalReplaceState.apply(this, arguments);
          forceScroll();
      };
      
      window.addEventListener('popstate', function() {
          forceScroll();
          setTimeout(forceScroll, 100);
      });
    </script>
